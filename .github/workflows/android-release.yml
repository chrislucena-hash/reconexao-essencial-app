name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Código numérico maior que o último enviado ao Play Console'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.reconexaoessencial.com.br/api/v1
      VERSION_CODE: ${{ inputs.version_code }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare upload keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > frontend/android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > frontend/android/keystore.properties

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate and sync Android
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npx cap sync android

      - name: Build signed Android artifacts
        working-directory: frontend/android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify Android signatures
        working-directory: frontend/android
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconexao-essencial-release-android
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
