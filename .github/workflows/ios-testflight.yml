name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App Store version (CFBundleShortVersionString)
        required: true
        default: '1.0.2'
        type: string
      build_number:
        description: App Store build number (CFBundleVersion)
        required: true
        default: '6'
        type: string
  push:
    tags:
      - 'ios-release-*'

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS and upload to TestFlight
    runs-on: macos-26

    env:
      BUNDLE_ID: com.reconexaoessencial
      RELEASE_VERSION: ${{ inputs.version_name || '1.0.2' }}
      BUILD_NUMBER: ${{ inputs.build_number || '6' }}
      VITE_API_BASE_URL: https://api.reconexaoessencial.com.br/api/v1
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      CERTIFICATE_PASSPHRASE: ${{ secrets.CERTIFICATE_PASSPHRASE }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate release inputs
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version_name: $RELEASE_VERSION"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build_number: $BUILD_NUMBER"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate and build web assets
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare signing files and keychain
        shell: bash
        run: |
          printf "%s" "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          printf "%s" "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security list-keychains -d user -s build.keychain-db
          security default-keychain -s build.keychain-db

          security import cert.p12 \
            -k build.keychain-db \
            -P "$CERTIFICATE_PASSPHRASE" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain-db

          security find-identity -v -p codesigning build.keychain-db

          PROFILE_NAME=$(security cms -D -i profile.mobileprovision 2>/dev/null | plutil -extract Name raw -o - -)
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)

          if [[ -z "$PROFILE_NAME" || -z "$PROFILE_UUID" ]]; then
            echo "Failed to read provisioning profile"
            exit 1
          fi

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive iOS app
        shell: bash
        run: |
          mkdir -p build

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            archive \
            -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Validate archived app metadata
        shell: bash
        run: |
          APP_INFO="$PWD/build/App.xcarchive/Products/Applications/App.app/Info.plist"
          ARCHIVE_BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$APP_INFO")
          ARCHIVE_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_INFO")
          ARCHIVE_BUILD=$(plutil -extract CFBundleVersion raw -o - "$APP_INFO")

          test "$ARCHIVE_BUNDLE_ID" = "$BUNDLE_ID"
          test "$ARCHIVE_VERSION" = "$RELEASE_VERSION"
          test "$ARCHIVE_BUILD" = "$BUILD_NUMBER"

      - name: Export IPA
        shell: bash
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$PWD/build"

      - name: Decode App Store Connect API key
        id: decode_key
        shell: bash
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          DECODED=$(printf "%s" "$APPSTORE_API_KEY_P8" | base64 --decode)

          while IFS= read -r KEY_LINE; do
            if [[ -n "$KEY_LINE" ]]; then
              echo "::add-mask::$KEY_LINE"
            fi
          done <<< "$DECODED"

          {
            echo "key<<KEYEOF"
            echo "$DECODED"
            echo "KEYEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload IPA to App Store Connect
        uses: apple-actions/upload-testflight-build@v5.3.0
        with:
          app-path: ${{ github.workspace }}/build/App.ipa
          app-type: ios
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-private-key: ${{ steps.decode_key.outputs.key }}
          wait-for-processing: 'true'

      - name: Upload IPA artifact
        if: ${{ always() && hashFiles('build/App.ipa') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reconexao-essencial-ios-${{ env.RELEASE_VERSION }}-${{ env.BUILD_NUMBER }}
          path: build/App.ipa
          if-no-files-found: error
          retention-days: 14
