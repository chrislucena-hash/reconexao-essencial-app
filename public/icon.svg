<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Cyan Smoke Gradient 1 -->
    <linearGradient id="cyanSmoke1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cyan Smoke Gradient 2 (Highlight) -->
    <linearGradient id="cyanSmoke2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Purple/Magenta Smoke Gradient 1 -->
    <linearGradient id="purpleSmoke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#9333EA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.95" />
    </linearGradient>

    <!-- Purple/Magenta Smoke Gradient 2 -->
    <linearGradient id="purpleSmoke2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Cyan Gradient -->
    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <!-- Text Purple Gradient -->
    <linearGradient id="textPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="smokeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="headGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#smokeGlow)">
    <!-- LEFT LOBE - Outer Cyan Smoke Ribbon -->
    <path d="M 300 430 
             C 250 380, 130 320, 90 220 
             C 50 120, 110 50, 200 60 
             C 255 66, 280 110, 300 150 
             C 280 115, 235 85, 185 95 
             C 120 110, 85 170, 115 235 
             C 150 310, 240 365, 300 430 Z" 
          fill="url(#cyanSmoke1)" opacity="0.9" />

    <!-- LEFT LOBE - Inner Cyan Swirl Ribbon -->
    <path d="M 300 380 
             C 255 330, 160 280, 130 205 
             C 105 135, 145 85, 205 90 
             C 245 95, 275 130, 290 170 
             C 270 135, 230 115, 185 125 
             C 140 138, 130 180, 150 225 
             C 175 280, 245 330, 300 380 Z" 
          fill="url(#cyanSmoke2)" opacity="0.75" />

    <!-- RIGHT LOBE - Outer Purple/Magenta Smoke Ribbon -->
    <path d="M 300 430 
             C 350 380, 470 320, 510 220 
             C 550 120, 490 50, 400 60 
             C 345 66, 320 110, 300 150 
             C 320 115, 365 85, 415 95 
             C 480 110, 515 170, 485 235 
             C 450 310, 360 365, 300 430 Z" 
          fill="url(#purpleSmoke1)" opacity="0.9" />

    <!-- RIGHT LOBE - Inner Purple Swirl Ribbon -->
    <path d="M 300 380 
             C 345 330, 440 280, 470 205 
             C 495 135, 455 85, 395 90 
             C 355 95, 325 130, 310 170 
             C 330 135, 370 115, 415 125 
             C 460 138, 470 180, 450 225 
             C 425 280, 355 330, 300 380 Z" 
          fill="url(#purpleSmoke2)" opacity="0.75" />

    <!-- CENTER S-SWIRL INTERTWINING RIBBON -->
    <path d="M 300 150 
             C 270 180, 250 220, 270 270 
             C 285 305, 310 340, 300 430 
             C 290 350, 260 300, 245 260 
             C 230 210, 260 175, 300 150 Z" 
          fill="url(#cyanSmoke1)" opacity="0.8" />

    <path d="M 300 150 
             C 330 180, 350 220, 330 270 
             C 315 305, 290 340, 300 430 
             C 310 350, 340 300, 355 260 
             C 370 210, 340 175, 300 150 Z" 
          fill="url(#purpleSmoke1)" opacity="0.8" />

    <!-- TOP CENTER HUMAN SILHOUETTE (HEAD & TORSO SPARK) -->
    <!-- Glowing Head -->
    <ellipse cx="300" cy="72" rx="16" ry="22" fill="#38BDF8" filter="url(#headGlow)" opacity="0.9" />
    <ellipse cx="300" cy="72" rx="11" ry="15" fill="#E0F2FE" />

    <!-- Upper Body Flowing Down -->
    <path d="M 300 92 
             C 288 120, 280 150, 285 180 
             C 292 220, 305 280, 300 430 
             C 295 280, 308 220, 315 180 
             C 320 150, 312 120, 300 92 Z" 
          fill="url(#cyanSmoke2)" opacity="0.85" />

    <!-- Luminous Central Spine Energy Line -->
    <path d="M 300 72 C 295 150, 305 270, 300 430" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- TEXT SECTION AT BOTTOM (EXACTLY LIKE THE ATTACHMENT) -->
  <!-- RECONEXÃO -->
  <text x="300" y="515" 
        text-anchor="middle" 
        fill="url(#textCyan)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="52" 
        font-weight="300" 
        letter-spacing="0.22em">
    RECONEXÃO
  </text>

  <!-- ESSENCIAL -->
  <text x="300" y="575" 
        text-anchor="middle" 
        fill="url(#textPurple)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="300" 
        letter-spacing="0.36em">
    ESSENCIAL
  </text>
</svg>
